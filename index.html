<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b}
header{background:linear-gradient(90deg,#d97706,#ea580c,#d97706);color:#fff}
.hwrap{max-width:1100px;margin:0 auto;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.hwrap .sub{margin:2px 0 0;font-size:12px;color:#fef3c7}

#tabs{max-width:1100px;margin:0 auto;padding:0 8px;display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:rgba(255,255,255,.18);color:#fff;padding:9px 14px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px;cursor:pointer}

#msg.err .inner{background:#fff1f2;border:1px solid #fecaca;color:#b91c1c}

.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:14px;overflow:hidden}
.card>.hd{padding:10px 14px;background:#f8fafc;border-bottom:1px solid #f1f5f9;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.chatfab{position:fixed;bottom:16px;right:16px;z-index:99;width:52px;height:52px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}

  var t = null;

<body>
<header>
  <div class="hwrap">
    <div>
      <h1>Plan Zajęć <span style="font-weight:400;font-size:14px;opacity:.95">— SPS nr 7</span></h1>
      <p class="sub">Szkoła podstawowa specjalna — automat + poprawki ręczne · dane nauczycieli tylko lokalnie</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button id="themeBtn" class="thbtn" title="Tryb: systemowy / ciemny / jasny"></button>
      <div id="badge"></div>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<div id="msg"></div>
<main id="main"></main>
<footer>Dane zapisują się automatycznie w tej przeglądarce (localStorage) — nic nie jest wysyłane na serwer. Wersja 6.14.</footer>
<script>
"use strict";
/* ==================== stałe, stan ==================== */
var DAYS = ["Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek"];
var NH = 8; // slotów dziennie
function slotBlocked(settings, s){ return ((settings && settings.blockedSlots) || []).indexOf(s) >= 0; }
var LS = "plan-zajec-vibe-v1";
var S = null;
var tab = "plan", sel = null, viewMode = "class", viewSel = "", ogrT = "", ogrC = "", importRows = null, importText = "", eksMode = "klasy";
var confirmKey = null, confirmTimer = null;

/* ==================== tryb jasny/ciemny ==================== */
var THEME_LS = "plan-zajec-theme";
function themeMode(){ try{ return localStorage.getItem(THEME_LS) || "auto"; }catch(e){ return "auto"; } }
function applyTheme(){
  var m = themeMode();
  var dark = m === "dark" || (m === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  var b = document.getElementById("themeBtn");
  if (b) b.textContent = m === "dark" ? "🌙 Ciemny" : (m === "light" ? "☀️ Jasny" : "🖥️ Systemowy");
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#020617" : "#d97706");
}
function cycleTheme(){
  var order = ["auto","dark","light"];
  var next = order[(order.indexOf(themeMode()) + 1) % order.length];
  try{ localStorage.setItem(THEME_LS, next); }catch(e){}
  applyTheme();
}

function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function normalize(p){
  if (!p.settings) p.settings = { teacherMaxPerDay: 7, classMaxPerDay: 7 };
  if (!p.settings.lessonTimes || p.settings.lessonTimes.length !== NH) p.settings.lessonTimes = defaultLessonTimes();
  if (p.settings.friMax7 == null) p.settings.friMax7 = true;
  if (p.settings.blockedSlots == null) p.settings.blockedSlots = p.settings.friMax7 ? [4 * NH + (NH - 1)] : [];
  if (!Array.isArray(p.settings.blockedSlots)) p.settings.blockedSlots = [];
  if (p.settings.maxGaps == null) p.settings.maxGaps = 2;
  if (!p.settings.gapExceptions) p.settings.gapExceptions = "";
  if (p.settings.autBlocks == null) p.settings.autBlocks = true;
  if (!p.settings.pairs) p.settings.pairs = [];
  if (p.settings.classMaxGaps == null) p.settings.classMaxGaps = 1;
  if (!Array.isArray(p.settings.rules)) p.settings.rules = [];
  if (!p.settings.assistantUrl) p.settings.assistantUrl = "";
  if (!p.settings.chatToken) p.settings.chatToken = "";
  if (p.settings.wTeacherGap == null) p.settings.wTeacherGap = 150;
  if (p.settings.wClassGap == null) p.settings.wClassGap = 150;
  if (p.settings.wSwMid == null) p.settings.wSwMid = 40;
  if (p.settings.wAutBlock == null) p.settings.wAutBlock = 40;
  if (p.settings.wPair == null) p.settings.wPair = 120;
  if (p.settings.classMaxGapsPerDay == null) p.settings.classMaxGapsPerDay = 1;
  if (p.settings.wClassGapDay == null) p.settings.wClassGapDay = 150;
  p.classes.forEach(function(c){ if (c.rew == null) c.rew = rewFromName(c.name); if (!Array.isArray(c.blocked)) c.blocked = []; });
  p.activities.forEach(function(a){ if (a.group == null) a.group = ""; if (a.withClassId == null) a.withClassId = ""; if (a.link == null) a.link = ""; });
  if (!p.placement) p.placement = {};
  return p;
}
function loadState(){
  try{
    var raw = localStorage.getItem(LS);
    if (raw){ var p = JSON.parse(raw); if (p && p.classes && p.teachers && p.activities && p.settings) return normalize(p); }
  }catch(e){}
  return sps7State();
}
function defaultLessonTimes(){ var t = ["8:00"]; for (var i = 1; i < NH; i++) t.push((7 + i) + ":55"); return t; }
function minutesOf(t){ var m = /^(\d{1,2}):(\d{2})$/.exec((t || "").trim()); return m ? (+m[1]) * 60 + (+m[2]) : 0; }
function fmtTime(min){ return Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0"); }
function endOfLesson(t){ return fmtTime(minutesOf(t) + 45); }
function lessonTimes(){ return S.settings.lessonTimes || defaultLessonTimes(); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function colorIdx(s){ var h = 0; var str = String(s || ""); for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 997; return h % 10; }
function abbr(s){
  var skip = ["w","i","na","z","do","dla"];
  var raw = String(s || "").replace(/\./g," ").split(/\s+/).filter(Boolean);
  if (raw.length === 1) return raw[0].slice(0,3).toUpperCase();
  var init = raw.filter(function(w){ return skip.indexOf(w.toLowerCase()) < 0; }).map(function(w){ return w[0].toUpperCase(); }).join("");
  return init || raw[0].slice(0,3).toUpperCase();
}
function pad(s, n){ s = String(s); return s.length >= n ? s.slice(0, n) : s + " ".repeat(n - s.length); }
function nextId(items, prefix){
  var max = 0;
  items.forEach(function(it){ var m = new RegExp("^" + prefix + "(\\d+)$").exec(it.id); if (m) max = Math.max(max, +m[1]); });
  return prefix + (max + 1);
}
function kindOf(a){ return a && (a.kind === "rew" || a.kind === "swietl") ? a.kind : "dyd"; }
function kindL(L){ return L && (L.kind === "rew" || L.kind === "swietl") ? L.kind : "dyd"; }
function guessKind(subject){
  var s = String(subject || "").toLowerCase();
  if (/świetlic/.test(s)) return "swietl";
  if (/rewalid|terapi|integracj|logoped|korekcyj|zkk|socjoterap|psycholog|pedagog|trening|specjalist|relaks|gimnastyk/.test(s)) return "rew";
  return "dyd";
}
function rewTracksOf(c){ var r = c ? parseInt(c.rew, 10) : NaN; return (r >= 1 && r <= 6) ? r : 2; }
function rewFromName(name){
  var m = { "3caut":1, "5zet":1, "7aut":1, "8zet":1, "5am":3, "6am":3, "6b":3, "7a":3 };
  return m[normName(name)] || 2;
}
function classClash(lk, ok, lg, og){
  if (lk === "dyd" && ok === "dyd") return !(lg && og && lg !== og);
  if (lk === "dyd" || ok === "dyd") return true;
  return false;
}
function buildLessons(acts){
  var out = [];
  for (var a of acts){ for (var i = 0; i < a.hours; i++) out.push({ id: a.id + "-" + i, activityId: a.id, classId: a.classId, classIds: [a.classId].concat(a.withClassId ? [a.withClassId] : []), teacherId: a.teacherId, subject: a.subject, kind: kindOf(a), group: a.group || "", link: a.link || "" }); }
  return out;
}
function lessons(){ return buildLessons(S.activities); }
function tById(){ var m = {}; S.teachers.forEach(function(t){ m[t.id] = t; }); return m; }
function cById(){ var m = {}; S.classes.forEach(function(c){ m[c.id] = c; }); return m; }
function tName(id){ var t = tById()[id]; return t ? t.name : (id ? "?" : "—"); }
function tShort(id){ var t = tById()[id]; return t ? t.short : (id ? "?" : "—"); }
function cName(id){ var c = cById()[id]; return c ? c.name : "?"; }
function hoursBy(key){ var m = {}; S.activities.forEach(function(a){ m[a[key]] = (m[a[key]] || 0) + a.hours; }); return m; }

/* ==================== dane startowe ==================== */
function sps7State(){
  var names = ["1a","2a AUT","2b AUT (m)","3a AUT","3b AUT","3c AUT","4a AUT","5 ZET","5a M","6 AUT","6a M","6b","7 AUT","7a","8 ZET"];
  var rew =   [2,     2,       2,          2,      2,      1,       2,       1,       3,      2,      3,      3,    1,      3,    1];
  return {
    teachers: [],
    classes: names.map(function(n, i){ return { id: "c" + (i + 1), name: n, rew: rew[i], blocked: [] }; }),
    activities: [],
    placement: {},
    settings: {
      teacherMaxPerDay: 7, classMaxPerDay: 7, lessonTimes: defaultLessonTimes(),
      friMax7: true, blockedSlots: [39], maxGaps: 2, gapExceptions: "", autBlocks: true, rules: [], assistantUrl: "", chatToken: "",
      wTeacherGap: 150, wClassGap: 150, wSwMid: 40, wAutBlock: 40, wPair: 120, classMaxGapsPerDay: 1, wClassGapDay: 150,
      pairs: [{cls:"5a M",a:"polski",b:"matematyka"},{cls:"6a M",a:"polski",b:"matematyka"},{cls:"6b",a:"polski",b:"matematyka"},{cls:"7a",a:"polski",b:"matematyka"}]
    }
  };
}
function demoState(){
  function T(id, name, short, un){ return { id: id, name: name, short: short, unavail: un || [] }; }

      if (!classExists){ status = "warn"; noteParts.push("nowa klasa — zostanie dodana"); }
    }
    if (zeroH){ status = "err"; noteParts.push("0 godzin — przydział usunięty/odjęty, pomijam"); }
    if (hours > 30){ status = "err"; noteParts.push("podejrzanie dużo godzin (" + hours + ") — wygląda na wiersz podsumowania/pensum"); }
    if (teacher && /\d/.test(teacher)){ status = "err"; noteParts.push("nazwisko nauczyciela zawiera cyfry — śmieciowy wiersz"); }

    if (status3plus && status === "ok") status = "warn";

}

function importFileRead(input){
  var f = input.files && input.files[0]; if (!f) return;
  f.arrayBuffer().then(function(buf){
    var name = f.name.toLowerCase();
    try{
      if (name.slice(-5) === ".docx") importText = docxToTsv(zipRead(buf));
      else if (name.slice(-5) === ".xlsx") importText = xlsxToTsv(zipRead(buf));
      else importText = new TextDecoder("utf-8").decode(buf).replace(/^\uFEFF/, "");
      if (!importText.trim()) flash("Plik wygląda na pusty.", "warn");
      render();
    }catch(err){
      importText = "";
      render();
      flash("Nie uda\u0142o si\u0119 odczyta\u0107 pliku " + f.name + " (" + err.message + "). Wklej dane przez Ctrl+V albo zapisz jako .txt/.csv.", "err");
    }
  });

function parseDaySpec(spec){
  var s = String(spec == null ? "" : spec).trim();
  var out = { raw: s || "—", blocked: [], uncertain: false, unclear: false };
  if (!s) return out;

  if (s === "-"){ out.blocked = [1,2,3,4,5,6,7,8]; out.uncertain = true; return out; } /* „-" = raczej nieobecny, ale do potwierdzenia */
  if (/^(cał|cal|dostępn)/.test(low)) return out; /* „cały/dostępny" = bez blokad */
  low = low.replace(/\(\s*\d+\s*h[^)]*\)/g, " "); /* adnotacje typu „(3h)" to nie numery lekcji */

  var re = /(\d+)(?:\s*[-–]\s*(\d+))?/g, m;

    if (a >= 1 && a <= NH && b >= 1 && b <= NH && b >= a) for (var i = a; i <= b; i++) if (nums.indexOf(i) < 0) nums.push(i);
  }
  var wolny = /woln|nieobecn|nieregu/.test(low);
  var mOd = low.match(/od\s+(\d)\s*(?:t|l|lek|godz)?/);
  var mDo = low.match(/do\s+(\d)\s*(?:t|l|lek|godz)?/);
  var mOdCzas = low.match(/od\s+(\d{1,2}):(\d{2})/);
  var odL = null, doL = null;
  if (mOdCzas){ /* np. „od 9:00" → numer lekcji wg lessonTimes */
    var ltA = lessonTimes(), minA = parseInt(mOdCzas[1], 10) * 60 + parseInt(mOdCzas[2], 10);
    for (var li = 0; li < ltA.length; li++){
      var pA = ltA[li].split(":"), mnA = parseInt(pA[0], 10) * 60 + parseInt(pA[1], 10);

    }

  if (odL != null && doL != null){ rng(1, odL - 1); rng(doL + 1, NH); return out; } /* „od 5 do 8" → dostępny 5-8 */
  if (odL != null){ rng(1, odL - 1); return out; }                     /* „od 5" → dostępny od 5. lekcji */
  if (doL != null){ rng(doL + 1, NH); return out; }                    /* „do 7" → dostępny do 7. lekcji */
  if (nums.length){ out.blocked = nums; return out; }                  /* gołe liczby = „wolny wtedy" (konwencja Roberta) */

function parseAvailSheet(tsv){

  for (var i = 0; i < lines.length; i++) if (/#sheet:.*dyspozycyj/i.test(lines[i])){ i0 = i; break; }
  if (i0 < 0) return null;
  var rows = [], seen = {};
  for (var j = i0 + 1; j < lines.length; j++){
    if (/#sheet:/.test(lines[j])) break;

    if (!any) continue;
    var key = nm.replace(/\s*\(.*?\)\s*$/, "").trim().toLowerCase();

function parseDaySpecText(spec){ /* pola tekstowego: wszystko opisuje NIEDOSTĘPNOŚĆ */

  var out = [];

  var mDo = s.match(/do\s*(\d+)/);
  if (mOdDo){ rng(Math.max(1, +mOdDo[1]), Math.min(NH, +mOdDo[2])); return out; } /* „od 6 do 8" = wolny 6-8 */

  if (mDo){ rng(1, Math.min(NH, +mDo[1])); return out; }                    /* „do 3" = wolny lekcje 1-3 */
  var re = /(\d+)(?:\s*[-–]\s*(\d+))?/g, m;
  while ((m = re.exec(s))){ var a = parseInt(m[1], 10), b = m[2] != null ? parseInt(m[2], 10) : a; if (a >= 1 && a <= NH && b >= a && b <= NH) rng(a, b); }

}
function parseAvailText(str){
  var slots = [], skipped = [];
  String(str || "").split(/[;\n]/).forEach(function(chunk){
    var c = chunk.trim();

    else if (dl === "cz" || dl === "czw" || dl === "czwt") d = 3;

}

/* ---------- zakładka PLAN ---------- */
function lessonsBySlot(ls, placement){
  var m = {};
  for (var i = 0; i < ls.length; i++){
    var s = placement[ls[i].id]; if (s == null) continue;
    (m[s] = m[s] || []).push(ls[i]);
  }
  return m;
}
function setViewMode(v){ viewMode = v; sel = null; viewSel = ""; render(); }
function setViewSel(v){ viewSel = v; sel = null; render(); }
function chipClick(id){ sel = (sel === id ? null : id); render(); }
function runAuto(){
  var ls = lessons();
  if (!ls.length){ flash("Najpierw dodaj oddziały, nauczycieli i zajęcia w zakładce Dane.", "warn"); return; }
  var res = autoSchedule(ls, S.teachers, S.classes, S.settings, 25);
  S.placement = res.placement; sel = null; save(); render();
  if (res.unplaced.length === 0) flash("✅ Ułożono wszystkie " + ls.length + " lekcji.", "ok");
  else flash("Ułożono " + (ls.length - res.unplaced.length) + "/" + ls.length + ". Nieprzypisane dociśnij ręcznie (czerwone chipsy).", "warn");
}
function clearPlan(){ S.placement = {}; sel = null; save(); render(); flash("Plan wyczyszczony.", "ok"); }
function applyPlacement(np, okText){
  var errs = findViolations(lessons(), S.teachers, S.classes, np, S.settings);
  if (errs.length){ flash("⛔ " + errs[0], "err"); return; }
  S.placement = np; sel = null; save(); render(); flash(okText, "ok");
}
function cellClick(s){
  var ls = lessons(), placement = S.placement, bySlot = lessonsBySlot(ls, placement);
  var eff = viewSel;
  var hereList = (bySlot[s] || []).filter(function(x){ return viewMode === "class" ? x.classIds.indexOf(eff) >= 0 : x.teacherId === eff; });
  var here = hereList[0];
  if (sel == null){ if (here){ sel = here.id; render(); } return; }
  var SL = null; ls.forEach(function(l){ if (l.id === sel) SL = l; });
  if (!SL){ sel = null; render(); return; }
  var placed = placement[sel] != null;
  var np = Object.assign({}, placement); np[sel] = s;
  if (SL.link) ls.forEach(function(l){ if (l.link === SL.link && l.id !== sel && l.id.split("-")[1] === sel.split("-")[1]) np[l.id] = s; });
  if (!findViolations(ls, S.teachers, S.classes, np, S.settings).length){ applyPlacement(np, "✅ Przeniesiono."); return; }
  if (here && placed){
    var np2 = Object.assign({}, placement);
    var a = np2[sel], b = np2[here.id]; np2[sel] = b; np2[here.id] = a;
    if (SL.link) ls.forEach(function(l){ if (l.link === SL.link && l.id !== sel && l.id.split("-")[1] === sel.split("-")[1]) np2[l.id] = np2[sel]; });
    applyPlacement(np2, "✅ Zamieniono lekcje."); return;
  }
  if (here){
    delete np[here.id];
    applyPlacement(np, "Podmieniono — zajęta lekcja wróciła do nieprzypisanych."); return;
  }
  applyPlacement(np, "");
}
function unassign(id, ev){
  if (ev) ev.preventDefault();
  var L0 = null; lessons().forEach(function(l){ if (l.id === id) L0 = l; });
  if (L0 && L0.link){ var ixU = (id.split("-")[1] || "0"); lessons().forEach(function(l){ if (l.link === L0.link && (l.id.split("-")[1] || "0") === ixU) delete S.placement[l.id]; }); }
  else delete S.placement[id];
  if (sel === id) sel = null;
  save(); render();
  flash(L0 && L0.link ? "Powiązane lekcje wróciły do nieprzypisanych." : "Lekcja wróciła do nieprzypisanych.", "ok");
}
function renderPlan(){
  var ls = lessons(), placement = S.placement;
  var unplaced = ls.filter(function(l){ return placement[l.id] == null; });
  var placed = ls.length - unplaced.length;
  var ents = viewMode === "class" ? S.classes : S.teachers;
  var h = '<div class="row">';
  h += '<select class="inp" onchange="setViewMode(this.value)"><option value="class"' + (viewMode === "class" ? " selected" : "") + '>Widok: oddział</option><option value="teacher"' + (viewMode === "teacher" ? " selected" : "") + ">Widok: nauczyciel</option></select>";
  if (!ents.length){
    h += '<span class="hint">Brak ' + (viewMode === "class" ? "oddziałów" : "nauczycieli") + " — zacznij od zakładki Dane.</span></div>";
    return h;
  }
  var eff = ents.some(function(e){ return e.id === viewSel; }) ? viewSel : ents[0].id;
  viewSel = eff;
  h += '<select class="inp" onchange="setViewSel(this.value)">' + ents.map(function(e){ return '<option value="' + e.id + '"' + (e.id === eff ? " selected" : "") + ">" + esc(e.name) + "</option>"; }).join("") + "</select>";
  h += '<button class="btn" onclick="runAuto()">🪄 Wygeneruj automatycznie</button>';
  h += '<button class="btn2" onclick="confirmClick(\'plan\',clearPlan)">' + (confirmKey === "plan" ? "Na pewno wyczyścić?" : "🧹 Wyczyść plan") + "</button>";
  h += '<button class="btn2" onclick="checkRules()">✅ Sprawdź zasady</button>';
  h += '<span class="badge ' + (placed === ls.length && ls.length > 0 ? "ok" : "err") + '">' + placed + "/" + ls.length + " lekcji ułożonych</span>";
  h += "</div>";
  if (unplaced.length){
    h += '<div class="unplaced"><b>📦 Nieprzypisane (' + unplaced.length + ") — kliknij lekcję, potem wolne pole w planie:</b><div>";
    unplaced.forEach(function(L){
      h += '<button class="chip c' + colorIdx(L.subject) + (sel === L.id ? " sel" : "") + '" onclick="chipClick(\'' + L.id + '\')">' + esc(L.subject) + " • " + esc(cName(L.classIds[0])) + " • " + esc(tShort(L.teacherId)) + "</button>";
    });
    h += "</div></div>";
  }
  var softW = softPenalty(ls, S.teachers, S.classes, S.settings, placement);
  if (softW.det.length){
    h += '<div class="unplaced" style="border-color:#f59e0b"><b>⚠️ Uwagi do zasad (' + softW.det.length + ") — nie blokują ruchów:</b><ul style=\"margin:6px 0 0 18px\">";
    softW.det.slice(0, 12).forEach(function(m){ h += "<li>" + esc(m) + "</li>"; });
    if (softW.det.length > 12) h += "<li>… oraz " + (softW.det.length - 12) + " dalszych</li>";
    h += "</ul></div>";
  }
  var bySlot = lessonsBySlot(ls, placement);
  var lt = lessonTimes();
  var dayLoads = [0, 0, 0, 0, 0];
  for (var s in bySlot){
    var rel = bySlot[s].filter(function(x){ return viewMode === "class" ? x.classIds.indexOf(eff) >= 0 : x.teacherId === eff; });
    if (rel.length) dayLoads[Math.floor(s / NH)] += (viewMode === "class" ? 1 : rel.length);
  }
  h += '<div style="overflow-x:auto"><table class="plan"><tr><th></th>';
  for (var i = 0; i < NH; i++) h += "<th>lek. " + (i + 1) + "<br><span class='sub'>" + esc(lt[i]) + "</span></th>";
  h += "</tr>";
  for (var d = 0; d < 5; d++){
    h += '<tr><td class="day">' + DAYS[d] + '<br><span class="sub' + (dayLoads[d] > S.settings.classMaxPerDay ? " err" : "") + '">' + dayLoads[d] + " lek.</span></td>";
    for (var hh = 0; hh < NH; hh++){
      var s2 = d * NH + hh;
      var relC = (bySlot[s2] || []).filter(function(x){ return viewMode === "class" ? x.classIds.indexOf(eff) >= 0 : x.teacherId === eff; });
      var bl = S.settings.blockedSlots.indexOf(s2) >= 0;
      h += '<td onclick="cellClick(' + s2 + ')"' + (bl ? ' style="background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(148,163,184,.18) 5px,rgba(148,163,184,.18) 10px)"' : '') + '>';
      relC.forEach(function(L){
        h += '<div class="chip c' + colorIdx(L.subject) + (sel === L.id ? " sel" : "") + '" onclick="event.stopPropagation();chipClick(\'' + L.id + '\')" oncontextmenu="unassign(\'' + L.id + '\',event)" title="' + esc(L.subject) + (L.link ? " (↔ " + L.link + ")" : "") + " — prawy klik usuwa z planu\">"
           + '<span class="subj">' + esc(L.subject) + "</span>"
           + '<span class="sub">' + esc(viewMode === "class" ? tShort(L.teacherId) : L.classIds.map(cName).join("+")) + "</span></div>";
      });
      h += "</td>";
    }
    h += "</tr>";
  }
  h += "</table></div>";
  h += '<p class="hint">Klik lekcja → wolne pole = przeniesienie • lekcja → lekcja = zamiana • prawy klik = usuń z planu. Program pilnuje dostępności nauczycieli, podwójnych lekcji i limitów dziennych, a także zasad z wytycznych: zablokowane godziny (siatka w Zasadach planu), okienka, bloki AUT, powiązania tej samej godziny i pary przedmiotów.</p>';
  return h;
}

/* ---------- zakładka EKSPORT ---------- */
function eksModeSet(m){ eksMode = m; render(); }
function planText(kind, id, bySlot){
  var header = kind === "class" ? ("KLASA " + cName(id)) : ("NAUCZYCIEL: " + tName(id));
  var rows = [];
  rows.push("PLAN ZAJĘĆ — " + header);
  rows.push("=".repeat(90));
  rows.push("Godziny lekcyjne: " + lessonTimes().map(function(t, i){ return (i + 1) + " — " + t; }).join(", "));
  rows.push(pad("Godz", 6) + DAYS.map(function(d){ return pad(d, 16); }).join(""));
  for (var h2 = 0; h2 < NH; h2++){
    var row = pad(String(h2 + 1), 6);
    for (var d = 0; d < 5; d++){
      var s = d * NH + h2;
      var rel = (bySlot[s] || []).filter(function(x){ return kind === "class" ? x.classIds.indexOf(id) >= 0 : x.teacherId === id; });
      var cell = rel.map(function(L){ return abbr(L.subject) + " " + (kind === "class" ? tShort(L.teacherId) : L.classIds.map(function(x){ return abbr(cName(x)); }).join("+")); }).join(" / ");
      row += pad(rel.length ? cell : "—", 16);
    }
    rows.push(row);
  }
  return rows.join("\n");
}
function eksText(){
  var ls = lessons(), placement = S.placement, bySlot = lessonsBySlot(ls, placement);
  var unp = ls.filter(function(L){ return placement[L.id] == null; });
  var foot = unp.length ? ("\n\nNIEPRZYPISANE (" + unp.length + "):\n" + unp.map(function(L){ return "- " + L.subject + ", klasa " + L.classIds.map(cName).join("+") + ", " + tName(L.teacherId); }).join("\n")) : "";
  if (eksMode === "csv"){
    var out = ["Klasa;Dzień;Godzina;Przedmiot;Nauczyciel"];
    ls.filter(function(L){ return placement[L.id] != null; })
      .sort(function(a, b){ return cName(a.classIds[0]).localeCompare(cName(b.classIds[0])) || placement[a.id] - placement[b.id]; })
      .forEach(function(L){
        var s = placement[L.id];
        out.push(L.classIds.map(cName).join("+") + ";" + DAYS[Math.floor(s / NH)] + ";" + ((s % NH) + 1) + ";" + L.subject + ";" + tName(L.teacherId));
      });
    return out.join("\n") + foot;
  }
  var ids = eksMode === "klasy" ? S.classes.map(function(c){ return c.id; }) : S.teachers.map(function(t){ return t.id; });
  return ids.map(function(id){ return planText(eksMode === "klasy" ? "class" : "teacher", id, bySlot); }).join("\n\n") + foot;
}
function copyEks(){
  var ta = document.getElementById("eksText");
  ta.focus(); ta.select();
  function fallback(){
    try{ if (document.execCommand("copy")){ flash("Skopiowano do schowka.", "ok"); return; } }catch(e){}
    flash("Schowek niedostępny — tekst jest zaznaczony, skopiuj ręcznie (Ctrl+C).", "warn");
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){ flash("Skopiowano do schowka.", "ok"); }, fallback);
  } else fallback();
}
function planszeHtml(){
  var ls = lessons(), placement = S.placement, bySlot = lessonsBySlot(ls, placement);
  var lt = lessonTimes();
  var days = ["Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek"];
  var d = new Date(), stan = d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear();
  var css = "<style>"
    + "@page { size: A3 landscape; margin: 8mm; }"
    + "* { box-sizing: border-box; margin: 0; padding: 0; }"
    + "body { font-family: Arial, 'Segoe UI', sans-serif; background: #f2f4f7; }"
    + ".bar { position: sticky; top: 0; z-index: 9; background: #1f2d3d; color: #fff; padding: 4mm 8mm; display: flex; gap: 6mm; align-items: center; flex-wrap: wrap; }"
    + ".bar button { font-size: 5mm; padding: 2mm 6mm; border: 0; border-radius: 2mm; background: #4a90d9; color: #fff; cursor: pointer; }"
    + ".bar .tip { font-size: 3.6mm; opacity: .85; }"
    + "@media print { .bar { display: none; } body { background: #fff; } }"
    + ".pl { width: 400mm; padding: 10mm; background: #fff; margin: 8mm auto; page-break-after: always; }"
    + ".pl:last-child { page-break-after: auto; }"
    + "h1 { font-size: 28mm; text-align: center; letter-spacing: 2mm; }"
    + ".sub { text-align: center; font-size: 8mm; margin: 3mm 0 8mm; color: #333; }"
    + ".cls { text-align: center; font-size: 14mm; font-weight: bold; margin-bottom: 6mm; }"
    + "table { width: 100%; border-collapse: collapse; }"
    + "th, td { border: 1mm solid #222; font-size: 8.5mm; padding: 3mm; text-align: center; vertical-align: middle; }"
    + "th { font-size: 10mm; background: #e8edf3; }"
    + "th.hr { width: 48mm; }"
    + "td.empty { color: #ccc; }"
    + "hr.sep { border: 0; border-top: 0.8mm dashed #999; margin: 2mm 0; }"
    + "td i { display: block; font-style: normal; font-size: 6.5mm; color: #444; margin-top: 1.5mm; }"
    + "</style>";
  var body = "";
  S.classes.forEach(function(c){
    body += '<section class="pl">'
      + '<div class="cls">Oddział: ' + esc(c.name) + "</div>"
      + "<h1>PLAN LEKCJI</h1>"
      + '<div class="sub">Szkoła Podstawowa nr 7 Specjalna w Katowicach · 2026/2027 · stan na ' + stan + "</div>"
      + '<table><tr><th class="hr">Godzina</th>';
    for (var di = 0; di < 5; di++) body += "<th>" + days[di] + "</th>";
    body += "</tr>";
    for (var h2 = 0; h2 < NH; h2++){
      body += '<tr><th class="hr">' + esc(lt[h2]) + "–" + esc(endOfLesson(lt[h2])) + "</th>";
      for (var di2 = 0; di2 < 5; di2++){
        var sl = di2 * NH + h2, cell = [];
        (bySlot[sl] || []).forEach(function(L){ if (L.classIds.indexOf(c.id) >= 0) cell.push(L); });
        if (!cell.length) body += '<td class="empty">·</td>';
        else {
          body += "<td>";
          cell.forEach(function(L, ix){
            if (ix) body += "<hr class='sep'>";
            body += esc(L.subject) + "<i>" + esc(tName(L.teacherId)) + "</i>";
          });
          body += "</td>";
        }
      }
      body += "</tr>";
    }
    body += "</table></section>";
  });
  return '<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plansze planów lekcji</title>' + css + "</head><body>"
    + '<div class="bar"><button onclick="window.print()">🖨️ DRUKUJ / zapisz PDF</button><span class="tip">Drukuj: A3 lub A2 poziomo, marginesy Minimalne; przy A2 ustaw skalowanie „Dopasuj do strony".</span></div>'
    + body + "</body></html>";
}
function openPlansze(){
  var w = window.open("", "_blank");
  if (!w){ flash("Przeglądarka zablokowała otwieranie nowych kart — zezwól na wyskakujące okna i spróbuj ponownie.", "err"); return; }
  w.document.write(planszeHtml());
  w.document.close();
}
function renderEks(){
  var h = '<div class="card"><div class="hd"><span>🖨️ Eksport planów</span><button class="btn" onclick="copyEks()">📋 Kopiuj</button></div><div class="bd">';
  h += '<div class="row">'
     + '<button class="btn2' + (eksMode === "klasy" ? " on" : "") + '" onclick="eksModeSet(\'klasy\')">Plany klas</button>'
     + '<button class="btn2' + (eksMode === "nauczyciele" ? " on" : "") + '" onclick="eksModeSet(\'nauczyciele\')">Plany nauczycieli</button>'
     + '<button class="btn2' + (eksMode === "csv" ? " on" : "") + '" onclick="eksModeSet(\'csv\')">CSV (Excel)</button>'
     + '<button class="btn2" onclick="openPlansze()">🖼️ Plansze A3/A2</button>'
     + "</div>";
  h += '<textarea id="eksText" class="inp ta big" readonly>' + esc(eksText()) + "</textarea>";
  h += '<p class="hint">' + (eksMode === "csv" ? "CSV ze średnikami — Excel otworzy w kolumnach (jeśli nie, użyj Dane → Tekst jako kolumny)." : "Tekst o stałej szerokości kolumn — wklejasz do Worda/Excela/maila. Skróty przedmiotów z pierwszych liter.") + "</p>";
  h += '<p class="hint">🖼️ Plansze A3/A2: otwierają się w nowej karcie — po jednym wielkim planie na oddział, do wydruku na korytarz (duże litery, pełne nazwiska). Najlepiej drukować z komputera.</p>';
  h += "</div></div>";
  return h;
}

/* ==================== start ==================== */
var firstRun = false;
try{ if (!localStorage.getItem(LS)) firstRun = true; }catch(e){ firstRun = true; }
S = loadState();
if (firstRun) save();
var themeBtnEl = document.getElementById("themeBtn");
if (themeBtnEl) themeBtnEl.onclick = cycleTheme;
applyTheme();
if (window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if (themeMode() === "auto") applyTheme(); }); }catch(e){} }
chatLoad();
render();
if (firstRun) flash("Witaj! 👋 Wczytano nazwy oddziałów SPS nr 7. W zakładce 📋 Dane dodaj nauczycieli i wklej przydziały — dane zostaną wyłącznie u Ciebie.", "ok");
if ("serviceWorker" in navigator && location.protocol === "https:"){
  try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
}
